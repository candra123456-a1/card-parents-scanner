<!DOCTYPE html>

<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Card Parents - Scanner</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      text-align: center;
    }

    h2 {
      margin-bottom: 8px;
    }

    p {
      color: #555;
    }

    #qr-reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      background: white;
      border-radius: 15px;
      padding: 10px;
      box-sizing: border-box;
    }

    #hasil {
      max-width: 500px;
      margin: 20px auto;
      padding: 15px;
      background: white;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
    }

    #status {
      max-width: 500px;
      margin: 10px auto;
      font-size: 14px;
      color: #666;
    }
  </style>

</head>

<body>

  <h2>📷 Scanner QR</h2>

  <p>Arahkan kamera ke QR Code</p>

  <div id="qr-reader"></div>

  <div id="hasil">
    Menunggu kamera...
  </div>

  <div id="status"></div>


  <script>

    /* =====================================================
       KONFIGURASI APPS SCRIPT
    ===================================================== */

    const APPS_SCRIPT_URL =
      'https://script.google.com/macros/s/AKfycbyQVzrR6XUXwNq1vTODEhAoZQ5Jvq5jifjLIX5mnRgzxXiciZT9Eyk1YyCq7NDm9xep/exec';


    /* =====================================================
       AMBIL ID ORTU DARI URL
    ===================================================== */

    const params =
      new URLSearchParams(
        window.location.search
      );

    const idOrtu =
      String(
        params.get('idOrtu') || ''
      ).trim();


    /* =====================================================
       ELEMENT
    ===================================================== */

    const hasil =
      document.getElementById('hasil');

    const status =
      document.getElementById('status');


    /* =====================================================
       CEK ID WALI
    ===================================================== */

    if (!idOrtu) {

      hasil.innerText =
        '⚠️ ID wali tidak ditemukan.';

      status.innerText =
        'Scanner harus dibuka dari aplikasi CARD PARENTS.';

    }


    /* =====================================================
       SCANNER
    ===================================================== */

    let scanner = null;

    let sudahScan = false;


    function mulaiScanner() {

      if (!idOrtu) {
        return;
      }


      scanner =
        new Html5Qrcode(
          "qr-reader"
        );


      const config = {

        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }

      };


      scanner.start(

        {
          facingMode: "environment"
        },

        config,


        async function(decodedText) {

          if (sudahScan) {
            return;
          }

          sudahScan = true;


          hasil.innerText =
            "⏳ QR terbaca. Memproses...";

          status.innerText =
            "Menghubungi server...";


          try {

            await scanner.stop();

          } catch (error) {

            console.log(
              'Scanner stop:',
              error
            );

          }


          /* =================================================
             QR YANG DIBACA
          ================================================= */

          let idQR =
            decodedText.trim();


          /*
             QR Gerbang berisi URL.
             Untuk sementara dianggap sebagai QR01.
          */

          if (
            idQR.indexOf(
              'script.google.com'
            ) !== -1
          ) {

            idQR = 'QR01';

          }


          /* =================================================
             BENTUK URL REQUEST
          ================================================= */

          const requestUrl =
            APPS_SCRIPT_URL +
            '?action=scan' +
            '&idOrtu=' +
            encodeURIComponent(idOrtu) +
            '&idQR=' +
            encodeURIComponent(idQR);


          console.log(
            'URL REQUEST:',
            requestUrl
          );


          /* =================================================
             KIRIM REQUEST KE APPS SCRIPT
          ================================================= */

          fetch(
            requestUrl,
            {
              method: 'GET',
              mode: 'no-cors'
            }
          )

          .then(function() {

            console.log(
              'REQUEST ABSENSI TERKIRIM KE APPS SCRIPT:',
              requestUrl
            );


            hasil.innerText =
              "✅ QR terbaca.";

            status.innerText =
              "Data absensi sedang dikirim ke server...";


            setTimeout(
              function() {

                hasil.innerText =
                  "📋 Permintaan absensi sudah dikirim.";

                status.innerText =
                  "Silakan cek LOG ABSENSI.";

              },
              2500
            );

          })

          .catch(function(error) {

            console.error(
              'GAGAL KIRIM KE APPS SCRIPT:',
              error
            );


            hasil.innerText =
              "❌ Gagal mengirim data absensi.";

            status.innerText =
              "Gagal menghubungi server.";

          });

        },


        function(errorMessage) {

          // Abaikan error pencarian QR

        }

      )

      .then(function() {

        hasil.innerText =
          "📷 Kamera aktif. Arahkan ke QR Code.";

        status.innerText =
          "ID wali: " + idOrtu;

      })

      .catch(function(error) {

        console.error(
          'KAMERA ERROR:',
          error
        );

        hasil.innerText =
          "❌ Kamera gagal dibuka.";

        status.innerText =
          String(error);

      });

    }


    /* =====================================================
       MULAI
    ===================================================== */

    mulaiScanner();

  </script>

</body>
</html>
